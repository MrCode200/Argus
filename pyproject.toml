[project]
name = "argus"
version = "0.1.0"
description = "A tool to find the precise location of a star or planet relative to the viewer and controll motors to point at it."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "geopy>=2.4.1",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.12.0",
    "pyfiglet>=1.0.4",
    "requests>=2.32.5",
    "rich-pixels>=3.0.1",
    "skyfield>=1.53",
    "textual>=6.5.0",
    "textual-image>=0.8.4",
    "textual-imageview>=0.1.1",
]
