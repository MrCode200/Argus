[project]
name = "argus"
version = "0.1.0"
description = "A tool to find the precise location of a star or planet relative to the viewer and controll motors to point at it."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "geopy>=2.4.1",
    "pyfiglet>=1.0.4",
    "rich-pixels>=3.0.1",
    "skyfield>=1.53",
    "textual>=6.5.0",
]
